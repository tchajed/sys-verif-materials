[package]
name = "template"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
once_cell = "1.21.4"
rayon = "1.12.0"
regex = "1.12.3"
rusqlite = { version = "0.38.0", features = ["bundled", "chrono"] }
shell-words = "1.1.1"
similar = "3.0.0"
tempdir = "0.3.7"
walkdir = "2.5.0"

[dev-dependencies]
insta = { version = "1.47.2", features = ["yaml"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
